name: Mo Design V14 Preview Checks
on:
  push:
    branches: [mo-design-v14-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript files
        run: |
          find assets tests -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          find assets tests -type f -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check
      - name: Check V14 preview assets and media safety
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('index.html','utf8');
          const js=readFileSync('assets/v14-home.js','utf8');
          const css=readFileSync('assets/v14-home.css','utf8');
          assert.match(html, /class="v14-home"/);
          assert.match(html, /id="motion"/);
          assert.match(html, /v14-home.css/);
          assert.match(html, /v14-home.js/);
          assert.match(js, /showModal/);
          assert.match(js, /youtube-nocookie.com/);
          assert.doesNotMatch(html, /<video[^>]*autoplay/i);
          assert.ok(existsSync('assets/images/mohamed-mahmoud.webp'));
          assert.ok(existsSync('assets/images/mo-logo-white.webp'));
          assert.ok(css.includes('prefers-reduced-motion'));
          for (const file of ['v14-dashboard.html','v14-academy.html','v14-account.html','assets/v14-platform.js','assets/v14-studio.js','assets/v14-dashboard.js','assets/v14-academy.js']) assert.ok(existsSync(file), 'Missing V14 file: '+file);
          assert.match(html, /v14PlatformSections/);
          assert.match(html, /v14-studio.js/);
          assert.doesNotMatch(readFileSync('v14-account.html','utf8'), /<input[^>]*type="password"(?![^>]*disabled)/);
          console.log('V14 homepage smoke assertions passed.');
          NODE
      - name: Existing regression tests
        run: node --test tests/v13-loading-smoke.mjs tests/v13-regressions.mjs tests/seo-sitemap.mjs tests/prelaunch-audit.mjs
