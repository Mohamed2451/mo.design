name: Publish fresh portfolio and SEO pages

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'project.html'
      - 'index.html'
      - '.github/workflows/publish-portfolio.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fresh public portfolio pages and sitemap
        run: node scripts/update-sitemap.mjs
      - name: Install image encoder
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Generate optimized public portfolio media
        run: node scripts/build-optimized-public-images.mjs
      - name: Validate generated sitemap and project pages
        run: |
          node --test tests/v13-loading-smoke.mjs tests/v13-regressions.mjs tests/seo-sitemap.mjs
          node --input-type=module -e "import {readFile} from 'node:fs/promises'; const s=await readFile('sitemap.xml','utf8'); if(!s.includes('/projects/')||!s.includes('</urlset>')) process.exit(1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
