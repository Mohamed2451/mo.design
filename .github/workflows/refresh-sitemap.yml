name: Refresh search sitemap (development)

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: mo-design-v13-dev
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate published-project sitemap
        run: node scripts/update-sitemap.mjs
      - name: Commit reviewed-branch sitemap changes
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sitemap.xml
            git commit -m 'Refresh published project URLs in sitemap'
            git push origin HEAD:mo-design-v13-dev
          fi
